name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Generate icons and splash
        run: |
          npm i --no-save sharp
          node scripts/gen-assets.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: gradle assembleDebug --no-daemon

      - name: Publish release with APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TheAlgorithmMail.apk
          gh release create "app-build-${{ github.run_number }}" TheAlgorithmMail.apk \
            --title "The Algorithm Mail app — build ${{ github.run_number }}" \
            --notes "Download TheAlgorithmMail.apk and open it on your phone to install. Allow installs from your browser/files app when asked."
        env:
          GH_TOKEN: ${{ github.token }}
